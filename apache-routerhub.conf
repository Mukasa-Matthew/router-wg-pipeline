# RouterHub — Apache config (VPS uses Apache, not nginx)
# Enable: sudo a2enmod proxy proxy_http headers rewrite
# Install: sudo cp apache-routerhub.conf /etc/apache2/sites-available/routerhub.conf
#         sudo a2ensite routerhub && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName 198.199.76.158
    ServerAlias *

    # Root redirect to dashboard
    RedirectMatch ^/$ /dashboard/

    # RouterHub API — proxy to Node.js backend
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # RouterHub Frontend (SPA)
    Alias /dashboard /var/www/html/dashboard
    <Directory /var/www/html/dashboard>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /dashboard/index.html [L]
    </Directory>

    # MikHmon — PHP (adjust socket path if needed: /run/php/php8.1-fpm.sock etc.)
    Alias /mikhmon /var/www/html/mikhmon
    <Directory /var/www/html/mikhmon>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        <FilesMatch \.php$>
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/routerhub-error.log
    CustomLog ${APACHE_LOG_DIR}/routerhub-access.log combined
</VirtualHost>
