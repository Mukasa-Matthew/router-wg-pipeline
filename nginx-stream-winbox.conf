# Nginx stream config for Winbox proxy
# Add this to your main nginx.conf (inside http {} block's sibling) or include it.
#
# In /etc/nginx/nginx.conf, add at the top level (same level as http {}):
#
# stream {
#     include /etc/nginx/stream.d/*.conf;
# }
#
# Then create the directory:
#   sudo mkdir -p /etc/nginx/stream.d
#
# RouterHub will create winbox-router1.conf, winbox-router2.conf, etc. automatically
# when routers come online.
